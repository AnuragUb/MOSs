[General]
# WMV Watchdog Converter Configuration
# Windows Server 2012 R2 Standard

[Paths]
# Watch folder - where to monitor for WMV files
watch_folder=C:\WatchFolder
# Output base folder - where converted MP4 files will be saved
output_base_folder=C:\ConvertedOutput
# Log folder - where log files will be stored
log_folder=C:\WMVConverter\logs

[Service]
# Service name for Windows service
service_name=WMVWatchdogConverter
# Service display name
display_name=WMV Watchdog Converter Service
# Service description
description=Monitors folders for WMV files and converts them to MP4 while preserving folder structure
# Scan interval in seconds
scan_interval=30
# Auto-start service on boot
auto_start=true

[Conversion]
# FFmpeg video codec
video_codec=libx264
# Constant Rate Factor (18-28, lower = better quality)
crf=23
# Encoding preset (ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow)
preset=medium
# Audio codec
audio_codec=aac
# Audio bitrate
audio_bitrate=128k
# Enable fast start for web playback
fast_start=true

[Behavior]
# Delete original WMV file after successful conversion (true/false)
delete_original=false
# Skip files that already have MP4 equivalents (true/false)
skip_existing=true
# Process subdirectories recursively (true/false)
recursive=true
# Maximum concurrent conversions (0 = unlimited)
max_concurrent=2

[Performance]
# CPU priority (low, normal, high, realtime)
cpu_priority=normal
# Memory limit in MB (0 = unlimited)
memory_limit=0
# Enable hardware acceleration if available (true/false)
hardware_acceleration=false

[Logging]
# Enable detailed logging (true/false)
detailed_logging=true
# Log level (debug, info, warning, error)
log_level=info
# Log rotation - keep logs for X days
log_retention_days=30
# Maximum log file size in MB
max_log_size_mb=10

[Security]
# Require administrator privileges (true/false)
require_admin=true
# Allowed file extensions (comma-separated)
allowed_extensions=wmv
# Maximum file size in MB (0 = unlimited)
max_file_size_mb=0
# Enable file integrity checking (true/false)
integrity_check=false

[Monitoring]
# Enable email notifications (true/false)
email_notifications=false
# SMTP server for email notifications
smtp_server=
# Email address for notifications
notification_email=
# Notify on conversion errors (true/false)
notify_on_error=true
# Notify on conversion success (true/false)
notify_on_success=false
# Notify on service start/stop (true/false)
notify_on_service_events=true 