<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Co. Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }
        .container {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: var(--panel-shadow);
            border: 1px solid var(--border-color);
        }
        h1 {
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }
        .form-label {
            color: var(--text-primary);
        }
        .form-control {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .form-control:focus {
            background-color: var(--bg-tertiary);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(127, 156, 245, 0.25);
        }
        .list-group-item {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .list-group-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="music-co-page">
    <div class="container mt-5">
        <h1>Music Co. Management</h1>
        <div class="mb-3">
            <label for="newMusicCo" class="form-label">Add New Music Co</label>
            <div class="input-group">
                <input type="text" id="newMusicCo" class="form-control" placeholder="Enter new Music Co name">
                <button class="btn btn-primary" id="addMusicCoBtn">Add</button>
            </div>
        </div>
        <h4>Current Music Co Options</h4>
        <ul class="list-group" id="musicCoList"></ul>
    </div>
    <script>
        function fetchMusicCoList() {
            fetch('/api/music-co')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log('Fetched music co list:', data);
                    const list = document.getElementById('musicCoList');
                    list.innerHTML = '';
                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between align-items-center';
                        li.textContent = item.name;
                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn btn-danger btn-sm';
                        delBtn.textContent = 'Delete';
                        delBtn.onclick = function() {
                            if (confirm('Delete this Music Co?')) {
                                fetch(`/api/music-co/${item.id}`, { method: 'DELETE' })
                                    .then(res => {
                                        if (!res.ok) {
                                            throw new Error(`HTTP error! status: ${res.status}`);
                                        }
                                        return res.json();
                                    })
                                    .then(result => {
                                        console.log('Delete result:', result);
                                        fetchMusicCoList();
                                    })
                                    .catch(error => {
                                        console.error('Error deleting music co:', error);
                                        alert('Error deleting music co: ' + error.message);
                                    });
                            }
                        };
                        li.appendChild(delBtn);
                        list.appendChild(li);
                    });
                })
                .catch(error => {
                    console.error('Error fetching music co list:', error);
                    alert('Error loading music co list: ' + error.message);
                });
        }
        document.getElementById('addMusicCoBtn').onclick = function() {
            const name = document.getElementById('newMusicCo').value.trim();
            if (!name) return alert('Enter a name');
            
            console.log('Adding music co:', name);
            
            fetch('/api/music-co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                console.log('Add result:', data);
                if (data.error) {
                    alert(data.error);
                    return;
                }
                document.getElementById('newMusicCo').value = '';
                fetchMusicCoList();
            })
            .catch(error => {
                console.error('Error adding music co:', error);
                alert('Error adding music co: ' + error.message);
            });
        };
        fetchMusicCoList();
    </script>
</body>
</html>
