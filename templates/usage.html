<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <h1>Usage Management</h1>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Add New Usage</h5>
                    </div>
                    <div class="card-body">
                        <form id="addUsageForm">
                            <div class="mb-3">
                                <label for="usageName" class="form-label">Usage Name</label>
                                <input type="text" class="form-control" id="usageName" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Usage</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Existing Usage Options</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group" id="usageList">
                            <!-- Usage items will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load existing usage options
        function loadUsageOptions() {
            fetch('/api/usage')
                .then(response => response.json())
                .then(data => {
                    const usageList = document.getElementById('usageList');
                    usageList.innerHTML = '';
                    data.forEach(usage => {
                        const item = document.createElement('div');
                        item.className = 'list-group-item d-flex justify-content-between align-items-center';
                        item.innerHTML = `
                            ${usage.name}
                            <button class="btn btn-danger btn-sm" onclick="deleteUsage('${usage.id}')">Delete</button>
                        `;
                        usageList.appendChild(item);
                    });
                })
                .catch(error => console.error('Error loading usage options:', error));
        }

        // Add new usage option
        document.getElementById('addUsageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('usageName').value;
            fetch('/api/usage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name })
            })
            .then(response => response.json())
            .then(() => {
                document.getElementById('usageName').value = '';
                loadUsageOptions();
            })
            .catch(error => console.error('Error adding usage option:', error));
        });

        // Delete usage option
        function deleteUsage(id) {
            if (confirm('Are you sure you want to delete this usage option?')) {
                fetch(`/api/usage/${id}`, {
                    method: 'DELETE'
                })
                .then(() => loadUsageOptions())
                .catch(error => console.error('Error deleting usage option:', error));
            }
        }

        // Load usage options when page loads
        document.addEventListener('DOMContentLoaded', loadUsageOptions);
    </script>
</body>
</html>
