<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .card-header {
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }
        .card-title {
            color: var(--text-primary);
            font-weight: 600;
        }
        .form-label {
            color: var(--text-primary);
        }
        .form-control {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .form-control:focus {
            background-color: var(--bg-tertiary);
            border-color: var(--accent-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(127, 156, 245, 0.25);
        }
        .list-group-item {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .list-group-item:last-child {
            margin-bottom: 0;
        }
        h1 {
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Usage Management</h1>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Add New Usage</h5>
                    </div>
                    <div class="card-body">
                        <form id="addUsageForm">
                            <div class="mb-3">
                                <label for="usageName" class="form-label">Usage Name</label>
                                <input type="text" class="form-control" id="usageName" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Usage</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Existing Usage Options</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group" id="usageList">
                            <!-- Usage items will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load existing usage options
        function loadUsageOptions() {
            fetch('/api/usage')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Fetched usage list:', data);
                    const usageList = document.getElementById('usageList');
                    usageList.innerHTML = '';
                    data.forEach(usage => {
                        const item = document.createElement('div');
                        item.className = 'list-group-item d-flex justify-content-between align-items-center';
                        item.innerHTML = `
                            ${usage.name}
                            <button class="btn btn-danger btn-sm" onclick="deleteUsage('${usage.id}')">Delete</button>
                        `;
                        usageList.appendChild(item);
                    });
                })
                .catch(error => {
                    console.error('Error loading usage options:', error);
                    alert('Error loading usage options: ' + error.message);
                });
        }

        // Add new usage option
        document.getElementById('addUsageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('usageName').value.trim();
            
            if (!name) {
                alert('Please enter a usage name');
                return;
            }
            
            console.log('Adding usage:', name);
            
            fetch('/api/usage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Add usage result:', data);
                if (data.error) {
                    alert(data.error);
                    return;
                }
                document.getElementById('usageName').value = '';
                loadUsageOptions();
            })
            .catch(error => {
                console.error('Error adding usage option:', error);
                alert('Error adding usage option: ' + error.message);
            });
        });

        // Delete usage option
        function deleteUsage(id) {
            if (confirm('Are you sure you want to delete this usage option?')) {
                console.log('Deleting usage with ID:', id);
                
                fetch(`/api/usage/${id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Delete usage result:', data);
                    loadUsageOptions();
                })
                .catch(error => {
                    console.error('Error deleting usage option:', error);
                    alert('Error deleting usage option: ' + error.message);
                });
            }
        }

        // Load usage options when page loads
        document.addEventListener('DOMContentLoaded', loadUsageOptions);
    </script>
</body>
</html>
