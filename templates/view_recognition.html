<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recognition Details</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #f0f0f0;
            padding: 20px;
        }
        h1 {
            color: #7f9cf5;
            border-bottom: 2px solid #7f9cf5;
            padding-bottom: 10px;
        }
        pre {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <h1>Recognition API Response</h1>
    <pre id="jsonData"></pre>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const jsonDataContainer = document.getElementById('jsonData');
            try {
                const recognitionDataString = sessionStorage.getItem('recognitionData');
                if (recognitionDataString) {
                    const recognitionData = JSON.parse(recognitionDataString);
                    // Format and display the JSON data
                    jsonDataContainer.textContent = JSON.stringify(recognitionData, null, 2);
                } else {
                    jsonDataContainer.textContent = 'No recognition data found.';
                }
            } catch (error) {
                console.error('Error parsing recognition data:', error);
                jsonDataContainer.textContent = 'Error: Could not display recognition data.';
            }
        });
    </script>
</body>
</html>
