<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Tag Preset Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #404040;
            border-bottom: 1px solid #404040;
            color: #ffffff;
            font-weight: bold;
        }
        .form-control, .form-select {
            background-color: #3d3d3d;
            border: 1px solid #555555;
            color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #3d3d3d;
            border-color: #007bff;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        .list-group-item {
            background-color: #3d3d3d;
            border: 1px solid #555555;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-group-item:hover {
            background-color: #4d4d4d;
        }
        .tag-input {
            background-color: #3d3d3d;
            border: 1px solid #555555;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
        }
        .tag-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Title Tag Preset Management</h1>
            <a href="/" class="btn btn-secondary">← Back to Main Page</a>
        </div>
        
        <div class="card">
            <div class="card-header">
                Add New Title Tag Preset
            </div>
            <div class="card-body">
                <form id="addTagForm">
                    <div class="mb-3">
                        <label for="tagInput" class="form-label">Title Tag Preset:</label>
                        <input type="text" class="form-control" id="tagInput" placeholder="Enter title tag preset..." required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Preset</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                Existing Title Tag Presets
            </div>
            <div class="card-body">
                <div id="tagsList" class="list-group">
                    <!-- Tags will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load existing tags
        async function loadTags() {
            try {
                const response = await fetch('/api/unknown-tags');
                const tags = await response.json();
                displayTags(tags);
            } catch (error) {
                console.error('Error loading tags:', error);
            }
        }

        // Display tags in the list
        function displayTags(tags) {
            const tagsList = document.getElementById('tagsList');
            tagsList.innerHTML = '';
            
            tags.forEach(tag => {
                const listItem = document.createElement('div');
                listItem.className = 'list-group-item';
                listItem.innerHTML = `
                    <span>${tag.name}</span>
                    <button class="btn btn-danger btn-sm" onclick="deleteTag('${tag.id}')">Delete</button>
                `;
                tagsList.appendChild(listItem);
            });
        }

        // Add new tag
        document.getElementById('addTagForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const tagInput = document.getElementById('tagInput');
            const tag = tagInput.value.trim();
            
            if (tag) {
                try {
                    const response = await fetch('/api/unknown-tags', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ name: tag })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        tagInput.value = '';
                        loadTags();
                        showMessage('Title tag preset added successfully!', 'success');
                        refreshMainPageOptions();
                    } else {
                        const errorData = await response.json();
                        showMessage('Error adding tag: ' + (errorData.error || 'Unknown error'), 'error');
                    }
                } catch (error) {
                    console.error('Error adding tag:', error);
                    alert('Error adding tag');
                }
            }
        });

        // Load tags when page loads
        document.addEventListener('DOMContentLoaded', loadTags);

        // Show message function
        function showMessage(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show`;
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '9999';
            alertDiv.style.minWidth = '300px';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // Refresh main page title tag options
        function refreshMainPageOptions() {
            try {
                // Try to refresh the main page if it's open
                const mainPage = window.opener || window.parent;
                if (mainPage && mainPage !== window && mainPage.loadUnknownTagsOptions) {
                    mainPage.loadUnknownTagsOptions();
                }
            } catch (e) {
                // Ignore errors if main page is not accessible
                console.log('Main page not accessible for refresh');
            }
        }

        // Delete tag
        async function deleteTag(tagId) {
            if (confirm(`Are you sure you want to delete this title tag preset?`)) {
                try {
                    const response = await fetch(`/api/unknown-tags/${encodeURIComponent(tagId)}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadTags();
                        showMessage('Title tag preset deleted successfully!', 'success');
                        refreshMainPageOptions();
                    } else {
                        const errorData = await response.json();
                        showMessage('Error deleting tag: ' + (errorData.error || 'Unknown error'), 'error');
                    }
                } catch (error) {
                    console.error('Error deleting tag:', error);
                    showMessage('Error deleting tag', 'error');
                }
            }
        }
    </script>
</body>
</html>
