[General]
# WMV Converter Server Configuration
# Windows Server 2012 R2 Standard

[Paths]
# Input folder for WMV files (relative to script location)
input_folder=.
# Output folder for converted MP4 files
output_folder=converted
# Log folder for conversion logs
log_folder=logs

[Conversion]
# FFmpeg video codec
video_codec=libx264
# Constant Rate Factor (18-28, lower = better quality)
crf=23
# Encoding preset (ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow)
preset=medium
# Audio codec
audio_codec=aac
# Audio bitrate
audio_bitrate=128k
# Enable fast start for web playback
fast_start=true

[Server]
# Scan interval in seconds (longer for server environments)
scan_interval=30
# Maximum concurrent conversions (0 = unlimited)
max_concurrent=2
# Enable detailed logging
detailed_logging=true
# Log rotation (days)
log_retention=30

[Performance]
# CPU priority (low, normal, high, realtime)
cpu_priority=normal
# Memory limit in MB (0 = unlimited)
memory_limit=0
# Enable hardware acceleration if available
hardware_acceleration=false

[Monitoring]
# Enable email notifications
email_notifications=false
# SMTP server
smtp_server=
# Email address for notifications
notification_email=
# Notify on conversion errors
notify_on_error=true
# Notify on conversion success
notify_on_success=false

[Security]
# Require administrator privileges
require_admin=true
# Allowed file extensions (comma-separated)
allowed_extensions=wmv
# Maximum file size in MB (0 = unlimited)
max_file_size=0
# Enable file integrity checking
integrity_check=false 